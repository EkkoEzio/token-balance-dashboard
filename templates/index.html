<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token 余额看板</title>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  :root {
    --bg:#0f1117; --card:#1a1d27; --text:#e4e6eb; --muted:#8b8fa3;
    --accent:#4f8cff; --green:#34d399; --red:#f87171; --amber:#fbbf24;
    --border:#2a2e3a;
  }
  [data-theme="light"] {
    --bg:#f5f6fa; --card:#fff; --text:#1a1d27; --muted:#6b7280;
    --accent:#2563eb; --green:#10b981; --red:#ef4444; --amber:#f59e0b;
    --border:#e5e7eb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;padding:24px}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  h1{font-size:20px;font-weight:600}
  .last-update{font-size:11px;color:var(--muted);margin-top:2px}
  .next-hint{opacity:.7}
  .alert-banner{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;margin-bottom:16px;flex-wrap:wrap;cursor:default}
  .alert-banner.critical{background:rgba(248,113,113,.12);border:1px solid var(--red)}
  .alert-banner.warning{background:rgba(251,191,36,.12);border:1px solid var(--amber)}
  .alert-icon{font-size:14px}
  .alert-summary{font-size:13px;flex:1}
  .alert-toggle{background:none;border:1px solid var(--border);color:var(--text);padding:3px 10px;border-radius:5px;cursor:pointer;font-size:11px}
  .alert-detail{flex-basis:100%;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:none}
  .alert-detail{display:block}
  .alert-item{font-size:12px;padding:3px 0}
  .alert-item.critical{color:var(--red)} .alert-item.warning{color:var(--amber)}
.toolbar{display:flex;gap:8px}
.btn{background:var(--card);color:var(--text);border:1px solid var(--border);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.6;cursor:default}
.coast-hint{position:fixed;top:80px;right:24px;background:var(--card);border:1px solid var(--amber);color:var(--amber);padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:5;animation:coast-fade 3s ease-out forwards}
@keyframes coast-fade{0%,70%{opacity:1}100%{opacity:0}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
  .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .card-name{font-size:15px;font-weight:600}
  .tier{font-size:12px;color:var(--muted)}
  .card-refresh{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:4px;line-height:1}
  .card-refresh:hover{color:var(--accent);background:var(--bg)}
  .card-refresh:disabled{opacity:.4;cursor:default}
  .card-refresh.refresh-ok{color:var(--green)}
  .card-head-left{display:flex;align-items:center;gap:8px;min-width:0}
  .card-head-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .balance{font-size:32px;font-weight:700;margin:8px 0}
  .balance-sub{font-size:12px;color:var(--muted);margin-bottom:12px}
  .window{margin-bottom:14px}
  .window:last-child{margin-bottom:0}
  .window-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
  .bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px;transition:width .4s}
  .bar-fill.ok{background:var(--green)}
  .bar-fill.warn{background:var(--amber)}
  .bar-fill.empty{background:var(--red)}
  .reset{font-size:11px;color:var(--muted);margin-top:3px}
  .status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:8px}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .dot.ok{background:var(--green)} .dot.err{background:var(--red)} .dot.warn{background:var(--amber)}
  .placeholder{color:var(--muted);font-size:13px;text-align:center;padding:24px 0;line-height:1.8}
  .drawer{position:fixed;top:0;right:-380px;width:360px;height:100vh;background:var(--card);border-left:1px solid var(--border);padding:24px;transition:right .3s;overflow-y:auto;z-index:10}
  .drawer.open{right:0}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9;display:none}
  .overlay.show{display:block}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;margin-bottom:4px}
  .field input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:8px 10px;border-radius:6px;font-size:13px}
  .seg{display:flex;gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .seg button{flex:1;background:var(--bg);color:var(--text);border:none;padding:8px;cursor:pointer;font-size:12px}
  .seg button.active{background:var(--accent);color:#fff}
  .hint{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.6}
  .error-text{font-size:11px;color:var(--red);margin-top:4px;word-break:break-all}
  .tavly-accounts{display:flex;gap:12px;flex-wrap:wrap}
  .tavly-acc{flex:1;min-width:120px;background:var(--bg);border-radius:8px;padding:12px;text-align:center}
  .tavly-acc-label{font-size:11px;color:var(--muted);margin-bottom:4px}
  .tavly-num{font-size:26px;font-weight:700}
  .tavly-sub{font-size:11px;color:var(--muted);margin-top:4px}
  .prov-field{border-bottom:1px solid var(--border);padding-bottom:14px}
  .prov-head{display:flex;justify-content:space-between;align-items:center}
  .key-input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:8px 10px;border-radius:6px;font-size:13px}
  .key-actions{display:flex;align-items:center;gap:6px;margin-top:6px}
  .btn.mini{padding:5px 10px;font-size:12px}
  .ok-msg{font-size:11px;color:var(--green)}
  .switch{position:relative;width:36px;height:20px;display:inline-block;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:20px;transition:.3s}
  .slider:before{content:"";position:absolute;height:14px;width:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s}
  .switch input:checked + .slider{background:var(--green)}
  .switch input:checked + .slider:before{transform:translateX(16px)}
  .copy-dialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);width:320px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;z-index:20;opacity:0;pointer-events:none;transition:.2s}
  .copy-dialog.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .copy-dialog h3{font-size:15px;margin-bottom:4px}
  .copy-dialog input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:8px 10px;border-radius:6px;font-size:13px;margin-top:4px}
  .copy-dialog-msg{font-size:11px;color:var(--red);margin-top:6px;min-height:14px}
  .copy-dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  .copy-dialog-msg.success{color:var(--green)}
</style>
</head>
<body data-theme="dark" x-data="board()" x-init="init()" :data-theme="theme">

<div class="header">
  <div>
    <h1>Token 余额看板</h1>
    <div class="last-update" x-show="lastRefresh"><span x-text="'上次更新 · ' + agoTs(lastRefresh)"></span><span class="next-hint" x-text="'  ·  ' + staleHint()"></span></div>
  </div>
  <div class="toolbar">
    <button class="btn" @click="forceRefresh()" :disabled="loading"><span x-text="loading ? '刷新中…' : '刷新'"></span></button>
    <button class="btn" @click="settingsOpen=true">设置</button>
  </div>
</div>

<!-- 临时提示:刷新被 cooldown 拦截 -->
<div class="coast-hint" x-show="cooldownMsg" x-text="cooldownMsg"></div>

<!-- 告警红条 -->
<div class="alert-banner" x-show="alerts.length>0" :class="maxAlertLevel()">
  <span class="alert-icon" x-text="maxAlertLevel()==='critical' ? '🔴' : '🟡'"></span>
  <span class="alert-summary" x-text="alerts.length + '项告警 · ' + alerts.map(a=>a.name+' '+a.window).join('、')"></span>
  <button class="alert-toggle" @click="alertExpanded=!alertExpanded"><span x-text="alertExpanded ? '收起' : '详情'"></span></button>
  <div class="alert-detail" x-show="alertExpanded">
    <template x-for="(a,i) in alerts" :key="i">
      <div class="alert-item" :class="a.level"><span x-text="(a.level==='critical'?'🔴':'🟡')+' '+a.name+' · '+a.msg"></span></div>
    </template>
  </div>
</div>

<div class="grid">
  <template x-for="p in providers" :key="p.key">
    <div class="card">
      <div class="card-head">
        <div class="card-head-left">
          <span class="card-name" x-text="p.name"></span>
          <span class="tier" x-show="p.data && p.data.level">
            <span x-text="'套餐 · ' + (p.data.level||'')"></span>
            <span x-show="p.data.remaining_days!=null" x-text="' · 剩 ' + p.data.remaining_days + '天'"></span>
          </span>
        </div>
        <div class="card-head-right">
          <button class="card-refresh" @click="refreshOne(p.key)" :disabled="refreshing[p.key]===true" :title="'单独刷新'+p.name" :class="refreshing[p.key]==='ok'?'refresh-ok':''">
            <span x-text="refreshing[p.key]===true ? '⟳' : (refreshing[p.key]==='ok' ? '✓' : '↻')"></span>
          </button>
        </div>
      </div>

      <!-- 余额型:DeepSeek -->
      <template x-if="p.key==='deepseek' && p.status==='ok'">
        <div>
          <div class="balance" x-text="'¥ ' + p.data.total_balance"></div>
          <div class="balance-sub">
            充值 ¥<span x-text="p.data.topped_up_balance"></span> · 赠金 ¥<span x-text="p.data.granted_balance"></span>
          </div>
          <div class="status">
            <span class="dot" :class="p.data.is_available ? 'ok' : 'err'"></span>
            <span x-text="(p.data.is_available ? '可调用' : '余额不足') + ' · ' + agoFull(p.updated_at)"></span>
          </div>
        </div>
      </template>

      <!-- 窗口型:智谱 / 千问(同一套排版) -->
      <template x-if="(p.key==='zhipu'||p.key==='qianwen'||p.key==='minimax') && p.status==='ok'">
        <div>
          <template x-for="(w,i) in (p.data.windows||[])" :key="i">
            <div class="window">
              <div class="window-label">
                <span x-text="w.label + '窗口'"></span>
                <span x-text="w.unlimited ? '无限' : (w.used + ' / ' + w.total + ' ' + (w.unit||'积分'))"></span>
              </div>
              <div class="bar">
                <div class="bar-fill" :class="w.unlimited ? 'ok' : barClass(w)" :style="'width:' + (w.unlimited ? 100 : pct(w)) + '%'"></div>
              </div>
              <div class="reset" x-text="w.unlimited ? ('无限额度' + (w.note ? ' · ' + w.note : '')) : (pct(w) + '% · 剩余 ' + (100-pct(w)) + '% · ' + countdown(w.reset_at) + '后重置')"></div>
            </div>
          </template>
          <div class="status">
            <span class="dot ok"></span><span x-text="'已更新 · ' + agoFull(p.updated_at)"></span>
          </div>
        </div>
      </template>

      <!-- Tavly:window 型,和智谱同款排版 -->
      <template x-if="p.key==='tavly' && p.status==='ok'">
        <div>
          <template x-for="(acc,i) in (p.data.accounts||[])" :key="i">
            <div class="window">
              <div class="window-label">
                <span x-text="(acc.plan||'Tavly') + (acc.label ? ' · ' + acc.label : '')"></span>
                <span x-text="acc.remaining===null ? '无限' : (acc.used + ' / ' + acc.total + ' 次')"></span>
              </div>
              <div class="bar" x-show="acc.total">
                <div class="bar-fill" :class="tavlyBarClass(acc)" :style="'width:' + pctRaw(acc.used,acc.total) + '%'"></div>
              </div>
              <div class="reset" x-text="acc.remaining===null ? acc.reset_note : (acc.total ? pctRaw(acc.used,acc.total)+'% · 剩余 '+(100-pctRaw(acc.used,acc.total))+'% · ' : '') + acc.reset_note"></div>
            </div>
          </template>
          <template x-if="p.data.warning==='rate_limited'">
            <div class="error-text" style="color:var(--amber)" x-text="p.data.warning_msg || '限流冷却中,显示上次成功数据'"></div>
          </template>
          <template x-if="p.data.errors && p.data.errors.length">
            <div class="error-text" x-text="p.data.errors.join('; ')"></div>
          </template>
          <div class="status">
            <span class="dot" :class="p.data.warning==='rate_limited' ? 'warn' : 'ok'"></span>
            <span x-text="(p.data.warning==='rate_limited' ? '限流中 · 显示缓存 · ' : '已更新 · ') + agoFull(p.updated_at)"></span>
          </div>
        </div>
      </template>

      <!-- 错误 / Key失效 -->
      <template x-if="p.status==='error' || p.status==='expired'">
        <div>
          <div class="placeholder" x-text="errIcon(p) + ' ' + (p.error || '查询失败')"></div>
          <div class="status">
            <span class="dot err"></span><span x-text="(p.error_kind==='auth'||p.error_kind==='expired' ? '需处理 · ' : '稍后重试 · ') + ago(p.updated_at)"></span>
          </div>
        </div>
      </template>

      <!-- 未配置/占位 -->
      <template x-if="p.status==='unconfigured'">
        <div>
          <div class="placeholder">
            <span x-text="(p.data && p.data.note) ? p.data.note : '未配置 API Key'"></span><br>
            <span style="font-size:11px">点右上「设置」填入</span>
          </div>
        </div>
      </template>
    </div>
  </template>
</div>

<!-- 设置抽屉 -->
<div class="overlay" :class="settingsOpen?'show':''" @click="settingsOpen=false"></div>
<div class="drawer" :class="settingsOpen?'open':''">
  <h2 style="margin-bottom:20px;font-size:16px">设置</h2>
  <div class="field">
    <label>主题</label>
    <div class="seg">
      <template x-for="t in ['auto','light','dark']" :key="t">
        <button :class="theme===t?'active':''" @click="setTheme(t)" x-text="{auto:'跟随系统',light:'浅色',dark:'深色'}[t]"></button>
      </template>
    </div>
  </div>

  <template x-for="prov in settingsProviders" :key="prov.key">
    <div class="field prov-field">
      <div class="prov-head">
        <label x-text="prov.name"></label>
        <label class="switch">
          <input type="checkbox" :checked="!disabled.includes(prov.key)" @change="toggleDisable(prov.key, $event.target.checked)">
          <span class="slider"></span>
        </label>
      </div>
      <!-- 多key(tavly):两个输入框 -->
      <template x-if="prov.key==='tavly'">
        <div>
          <input class="key-input" type="password" placeholder="tvly-账号1..." x-model="keyInputs[prov.key]">
          <input class="key-input" type="password" placeholder="tvly-账号2(可空)..." x-model="keyInputs2[prov.key]" style="margin-top:6px">
          <div class="key-actions">
            <button class="btn mini" @click="saveKeyTavly(prov.key)">保存</button>
            <button class="btn mini" @click="copyKey(prov.key)">复制</button>
            <span class="ok-msg" x-show="savedMsg[prov.key]" x-text="savedMsg[prov.key]"></span>
          </div>
        </div>
      </template>
      <!-- 千问:sec_token + cookie(特殊双字段) -->
      <template x-if="prov.key==='qianwen'">
        <div>
          <input class="key-input" type="password" placeholder="sec_token (从F12 Payload里抓)" x-model="keyInputs['qianwen_sec_token']">
          <input class="key-input" type="password" placeholder="cookie (login_qianwenai_ticket=...)" x-model="keyInputs['qianwen_cookie']" style="margin-top:6px">
          <div class="key-actions">
            <button class="btn mini" @click="saveQianwen()">保存</button>
            <span class="ok-msg" x-show="savedMsg['qianwen']" x-text="savedMsg['qianwen']"></span>
          </div>
          <p class="hint" style="margin:4px 0 0">登录态会过期,失效后需重新抓取这两个值。</p>
        </div>
      </template>
      <!-- 单key(deepseek/智谱) -->
      <template x-if="prov.key!=='tavly' && prov.key!=='qianwen' && prov.needsKey===true">
        <div>
          <input class="key-input" type="password" :placeholder="prov.placeholder||''" x-model="keyInputs[prov.key]">
          <div class="key-actions">
            <button class="btn mini" @click="saveKey(prov.key)">保存</button>
            <button class="btn mini" @click="copyKey(prov.key)">复制</button>
            <span class="ok-msg" x-show="savedMsg[prov.key]" x-text="savedMsg[prov.key]"></span>
          </div>
        </div>
      </template>
      <template x-if="!prov.needsKey">
        <p class="hint" style="margin:0">走 Edge 登录态,无需填 Key。在 Edge 登录对应平台即可。</p>
      </template>
    </div>
  </template>

  <p class="hint">
    「复制」需先输主密码验证身份(首次使用请在下方设置主密码)。关闭开关后该供应商不再刷新、不展示。
  </p>

  <div class="field" style="margin-top:20px;border-top:1px solid var(--border);padding-top:16px">
    <label x-text="hasMasterPw ? '修改主密码' : '设置主密码'"></label>
    <input type="password" placeholder="用于复制 Key 时验证身份" x-model="masterPwInput">
    <button class="btn mini" style="margin-top:6px" @click="setMasterPw()" x-text="hasMasterPw ? '修改' : '设置'"></button>
    <span class="ok-msg" x-show="masterPwMsg" x-text="masterPwMsg"></span>
  </div>

  <div class="field" style="margin-top:20px;border-top:1px solid var(--border);padding-top:16px">
    <div class="prov-head">
      <label>额度告警</label>
      <label class="switch">
        <input type="checkbox" x-model="alertConfig.enabled" @change="saveAlertConfig()">
        <span class="slider"></span>
      </label>
    </div>
    <div class="key-actions" style="margin-top:8px">
      <label style="font-size:12px;white-space:nowrap">余额阈值 ¥</label>
      <input type="number" min="0" step="1" style="width:70px" x-model.number="alertConfig.threshold_balance" @change="saveAlertConfig()">
      <label style="font-size:12px;white-space:nowrap;margin-left:8px">剩余 %</label>
      <input type="number" min="1" max="99" style="width:60px" x-model.number="alertConfig.threshold_pct" @change="saveAlertConfig()">
    </div>
    <span class="ok-msg" x-show="savedMsg['__alerts__']" x-text="savedMsg['__alerts__']"></span>
    <p class="hint" style="margin-top:8px">额度低于阈值时顶部红条提示 + macOS 桌面通知(首次触发才弹,不重复)。</p>
  </div>
</div>

<!-- 复制Key密码弹窗 -->
<div class="overlay" :class="copyDialog.open?'show':''" @click="copyDialog.open=false"></div>
<div class="copy-dialog" :class="copyDialog.open?'open':''">
  <h3 x-text="copyDialog.title"></h3>
  <p class="hint" style="margin:8px 0">输入主密码以复制该 Key</p>
  <input type="password" placeholder="主密码" x-model="copyDialog.password" @keydown.enter="confirmCopy()">
  <div class="copy-dialog-msg" x-show="copyDialog.msg" x-text="copyDialog.msg"></div>
  <div class="copy-dialog-actions">
    <button class="btn" @click="copyDialog.open=false">取消</button>
    <button class="btn" @click="confirmCopy()">确认复制</button>
  </div>
</div>

<script>
function board(){
  return {
    providers:[], loading:false, settingsOpen:false, theme:'dark', tick:0,
    disabled:[], keyInputs:{}, keyInputs2:{}, savedMsg:{},
    hasMasterPw:false, masterPwInput:'', masterPwMsg:'',
    copyDialog:{open:false, provider:'', title:'', password:'', msg:''},
    lastRefresh:0,
    alerts:[], alertExpanded:false, alertConfig:{enabled:true,threshold_balance:10,threshold_pct:20},
    cooldownMsg:'',  // 临时提示:某 provider 刷新被 cooldown 拦截
    refreshing:{},  // 各卡片单独刷新状态 {key: bool}
    // 设置页展示的 provider 元数据(needsKey=false 的走 Edge cookie)
    settingsProviders:[
      {key:'deepseek',name:'DeepSeek',needsKey:true,placeholder:'sk-...'},
      {key:'zhipu',name:'智谱 Coding Plan',needsKey:true,placeholder:'xxx.yyy'},
      {key:'tavly',name:'Tavly',needsKey:true,placeholder:'tvly-...'},
      {key:'qianwen',name:'千问 Token Plan',needsKey:'qianwen'},
      {key:'minimax',name:'MiniMax Token Plan',needsKey:true,placeholder:'sk-cp-...(Subscription Key)'},
    ],
    async init(){
      await this.loadConfig();
      await this.poll();                      // 立即读缓存 → 瞬间渲染磁盘数据(不等网络)
      this.checkStaleAndRefresh();            // mount 即检 staleness,旧则后台分卡片刷
      await this.loadAlerts();
      setInterval(()=>this.pollThenMaybeRefresh(),30000);  // 30秒轮询+staleness 复检
      setInterval(()=>{this.tick++},1000);   // 倒计时每秒tick
    },
    async loadAlerts(){
      try{const r=await fetch('/api/alerts');const d=await r.json();this.alerts=d.alerts||[];this.alertConfig=d.config||this.alertConfig;}
      catch(e){}
    },
    maxAlertLevel(){return this.alerts.some(a=>a.level==='critical')?'critical':'warning'},
    errIcon(p){return {auth:'🔑',expired:'⏱️',network:'📡',rate_limit:'🐢',blocked:'🚫',unknown:'⚠️'}[p.error_kind]||'⚠️'},
    async saveAlertConfig(){
      const r=await fetch('/api/alerts/config',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(this.alertConfig)});
      const d=await r.json();if(d.ok){this.flashSaved('__alerts__');await this.loadAlerts();}
    },
    async loadConfig(){
      const r=await fetch('/api/config');const d=await r.json();
      this.theme=d.theme;this.disabled=d.disabled||[];
      const m=await fetch('/api/config/master-password-status');this.hasMasterPw=(await m.json()).has_master_password;
    },
    async poll(){
      // 只读缓存,不触发后端请求(后端由10分钟定时器自动刷新)
      try{const r=await fetch('/api/usage');const d=await r.json();this.providers=d.providers;this.lastRefresh=d.last_refresh||0;}
      catch(e){}
    },
    async forceRefresh(){
      // 手动刷新:触发后端立即拉取,并刷新告警
      this.loading=true;
      try{const r=await fetch('/api/refresh',{method:'POST'});const d=await r.json();this.providers=d.providers;this.lastRefresh=d.last_refresh||0;await this.loadAlerts();}
      finally{this.loading=false;}
    },
    refresh(){return this.forceRefresh();},  // 兼容旧调用
    async refreshOne(key){
      // 只刷新单个 provider(不影响其他家)
      this.refreshing[key]=true;
      try{
        const r=await fetch('/api/refresh/'+key,{method:'POST'});
        const d=await r.json();
        if(d.ok&&d.result){
          // 替换该卡片的数据
          this.providers=this.providers.map(p=>p.key===key?d.result:p);
          await this.loadAlerts();
          // 成功反馈:按钮短暂显示 ✓
          this.refreshing[key]='ok';
          setTimeout(()=>{this.refreshing[key]=false},1200);
        }else if(d.cooldown_remaining){
          // 限流拦截:显示冷却秒数,按钮回到正常状态(无错误)
          this.refreshing[key]=false;
          // 卡片底部暂存一条提示(用 cooldownMsg 临时字段,3 秒后清)
          this.cooldownMsg=`${key} 刷新太频繁,${d.cooldown_remaining} 秒后再试`;
          setTimeout(()=>{this.cooldownMsg=''},3000);
        }else{
          this.refreshing[key]=false;
        }
      }catch(e){this.refreshing[key]=false;}
    },
    agoTs(ts){this.tick;if(!ts)return'';const s=Math.floor((Date.now()/1000-ts));return s<60?'刚刚':Math.floor(s/60)+'分钟前'},
    anyRefreshing(){
      // 是否有任意卡片正在刷新(refreshing[k]===true,'ok' 不算)
      return Object.values(this.refreshing).some(v=>v===true);
    },
    checkStaleAndRefresh(){
      // staleness 检查:lastRefresh 存在 + 超过 600s + 当前没在刷 → 触发分卡片刷新
      if(!this.lastRefresh) return;            // 后端暂无数据,等后台并发拉
      const ageSec=Date.now()/1000-this.lastRefresh;
      if(ageSec<=600) return;                  // 新鲜
      if(this.anyRefreshing()) return;         // 已在刷新中,不重复触发
      this.refreshAllStale();
    },
    async refreshAllStale(){
      // 并发刷所有可见卡片;每家独立 try/catch,末尾统一 loadAlerts 一次
      const keys=this.providers.map(p=>p.key);
      await Promise.all(keys.map(k=>this._refreshOneSilent(k)));
      await this.loadAlerts();
    },
    async _refreshOneSilent(key){
      // refreshOne 的静默版:不重复 loadAlerts(refreshAllStale 末尾统一调)
      this.refreshing[key]=true;
      try{
        const r=await fetch('/api/refresh/'+key,{method:'POST'});
        const d=await r.json();
        if(d.ok&&d.result){
          this.providers=this.providers.map(p=>p.key===key?d.result:p);
          this.lastRefresh=Date.now()/1000;    // 后端已更新,前端同步时间戳
          this.refreshing[key]='ok';
          setTimeout(()=>{this.refreshing[key]=false},1200);
        }else if(d.cooldown_remaining){
          this.refreshing[key]=false;
          this.cooldownMsg=`${key} 刷新太频繁,${d.cooldown_remaining} 秒后再试`;
          setTimeout(()=>{this.cooldownMsg=''},3000);
        }else{
          this.refreshing[key]=false;
        }
      }catch(e){this.refreshing[key]=false;}
    },
    async pollThenMaybeRefresh(){
      // 30 秒轮询:读缓存后顺手复检 staleness
      await this.poll();
      this.checkStaleAndRefresh();
    },
    staleHint(){
      // 顶部时间提示:新鲜时显示「下次自动刷新 Xm Ys 后」,偏旧时显示状态文案
      this.tick;
      if(!this.lastRefresh) return '';
      const ageSec=Date.now()/1000-this.lastRefresh;
      if(ageSec<=600){
        const remain=600-Math.floor(ageSec);
        const m=Math.floor(remain/60),s=remain%60;
        return '下次自动刷新 '+m+'分'+s+'秒后';
      }
      if(this.anyRefreshing()) return '数据偏旧,后台刷新中…';
      return '数据偏旧';
    },
    agoFull(iso){this.tick;if(!iso)return'';const d=new Date(iso);const hh=String(d.getHours()).padStart(2,'0'),mm=String(d.getMinutes()).padStart(2,'0');const s=Math.floor((Date.now()-d)/1000);const rel=s<60?'刚刚':Math.floor(s/60)+'分钟前';return rel+' ('+hh+':'+mm+')'},
    pct(w){this.tick;return w.total?Math.round((w.used/w.total)*100):0},
    pctRaw(used,total){return total?Math.round((used/total)*100):0},
    barClass(w){this.tick;const p=this.pct(w);return p>=90?'empty':p>=70?'warn':'ok'},
    tavlyBarClass(acc){this.tick;const p=this.pctRaw(acc.used,acc.total);return p>=90?'empty':p>=70?'warn':'ok'},
    countdown(iso){this.tick;if(!iso)return'未知';const ms=new Date(iso)-new Date();if(ms<=0)return'已重置';
      const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);
      return h>0?h+'小时'+m+'分':m+'分'},
    ago(iso){this.tick;if(!iso)return'';const s=Math.floor((Date.now()-new Date(iso))/1000);
      return s<60?'刚刚':Math.floor(s/60)+'分钟前'},
    flashSaved(p){this.savedMsg[p]='已保存';setTimeout(()=>{this.savedMsg[p]=''},1500)},
    async saveKey(p){
      const r=await fetch('/api/config/api-key',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({provider:p,key:this.keyInputs[p]})});
      const d=await r.json();if(d.ok){this.keyInputs[p]='';this.flashSaved(p);await this.refresh();}
    },
    async saveKeyTavly(p){
      // tavly 双 key:过滤空值后逗号拼接
      const k1=(this.keyInputs[p]||'').trim(),k2=(this.keyInputs2[p]||'').trim();
      const parts=[k1,k2].filter(x=>x);
      const combined=parts.join(',');
      const r=await fetch('/api/config/api-key',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({provider:p,key:combined})});
      const d=await r.json();if(d.ok){this.keyInputs[p]='';this.keyInputs2[p]='';this.flashSaved(p);await this.refresh();}
    },
    async saveQianwen(){
      // 千问:sec_token + cookie 分两次存
      const sec=(this.keyInputs['qianwen_sec_token']||'').trim();
      const ck=(this.keyInputs['qianwen_cookie']||'').trim();
      if(!sec||!ck){this.savedMsg['qianwen']='两个都要填';setTimeout(()=>this.savedMsg['qianwen']='',1500);return;}
      await fetch('/api/config/api-key',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({provider:'qianwen_sec_token',key:sec})});
      await fetch('/api/config/api-key',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({provider:'qianwen_cookie',key:ck})});
      this.keyInputs['qianwen_sec_token']='';this.keyInputs['qianwen_cookie']='';
      this.flashSaved('qianwen');await this.refresh();
    },
    async revealKey(p){
      // 已弃用,保留为 no-op(用 copyKey 代替)
    },
    copyKey(p){
      // 打开密码弹窗
      const name=this.settingsProviders.find(x=>x.key===p)?.name||p;
      this.copyDialog={open:true,provider:p,title:'复制 '+name+' Key',password:'',msg:''};
    },
    async confirmCopy(){
      const p=this.copyDialog.provider;
      const r=await fetch('/api/config/verify',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({provider:p,password:this.copyDialog.password})});
      const d=await r.json();
      if(d.ok&&d.key){
        // 复制到剪贴板
        try{await navigator.clipboard.writeText(d.key);}catch(e){
          // 兜底:选中文本
          const ta=document.createElement('textarea');ta.value=d.key;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
        }
        this.copyDialog.msg='已复制到剪贴板!';
        this.copyDialog.open=false;
        setTimeout(()=>this.settingsOpen=false,500);
      }else{
        this.copyDialog.msg=d.error||'复制失败';
      }
    },
    async setMasterPw(){
      const pw=this.masterPwInput;
      if(!pw){this.masterPwMsg='请输入密码';return;}
      const r=await fetch('/api/config/master-password',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({password:pw})});
      const d=await r.json();
      if(d.ok){this.hasMasterPw=true;this.masterPwInput='';this.masterPwMsg='已设置';setTimeout(()=>this.masterPwMsg='',1500);}
      else{this.masterPwMsg=d.error||'设置失败';}
    },
    async toggleDisable(p,checked){
      // checked=true 表示启用,所以 disabled=!checked
      await fetch('/api/config/disabled',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({provider:p,disabled:!checked})});
      await this.loadConfig();
      await this.refresh();
    },
    async setTheme(t){this.theme=t;await fetch('/api/config/theme',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({theme:t})});},
  }
}
</script>
