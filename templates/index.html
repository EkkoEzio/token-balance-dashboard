<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token 余额看板</title>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  :root {
    --bg:#0f1117; --card:#1a1d27; --text:#e4e6eb; --muted:#8b8fa3;
    --accent:#4f8cff; --green:#34d399; --red:#f87171; --amber:#fbbf24;
    --border:#2a2e3a;
  }
  [data-theme="light"] {
    --bg:#f5f6fa; --card:#fff; --text:#1a1d27; --muted:#6b7280;
    --accent:#2563eb; --green:#10b981; --red:#ef4444; --amber:#f59e0b;
    --border:#e5e7eb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;padding:24px}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  h1{font-size:20px;font-weight:600}
  .toolbar{display:flex;gap:8px}
  .btn{background:var(--card);color:var(--text);border:1px solid var(--border);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.6;cursor:default}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
  .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .card-name{font-size:15px;font-weight:600}
  .tier{font-size:12px;color:var(--muted)}
  .balance{font-size:32px;font-weight:700;margin:8px 0}
  .balance-sub{font-size:12px;color:var(--muted);margin-bottom:12px}
  .window{margin-bottom:14px}
  .window:last-child{margin-bottom:0}
  .window-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
  .bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px;transition:width .4s}
  .bar-fill.ok{background:var(--green)}
  .bar-fill.warn{background:var(--amber)}
  .bar-fill.empty{background:var(--red)}
  .reset{font-size:11px;color:var(--muted);margin-top:3px}
  .status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:8px}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .dot.ok{background:var(--green)} .dot.err{background:var(--red)} .dot.warn{background:var(--amber)}
  .placeholder{color:var(--muted);font-size:13px;text-align:center;padding:24px 0;line-height:1.8}
  .drawer{position:fixed;top:0;right:-380px;width:360px;height:100vh;background:var(--card);border-left:1px solid var(--border);padding:24px;transition:right .3s;overflow-y:auto;z-index:10}
  .drawer.open{right:0}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9;display:none}
  .overlay.show{display:block}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;margin-bottom:4px}
  .field input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:8px 10px;border-radius:6px;font-size:13px}
  .seg{display:flex;gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .seg button{flex:1;background:var(--bg);color:var(--text);border:none;padding:8px;cursor:pointer;font-size:12px}
  .seg button.active{background:var(--accent);color:#fff}
  .hint{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.6}
  .error-text{font-size:11px;color:var(--red);margin-top:4px;word-break:break-all}
  .tavly-accounts{display:flex;gap:12px;flex-wrap:wrap}
  .tavly-acc{flex:1;min-width:120px;background:var(--bg);border-radius:8px;padding:12px;text-align:center}
  .tavly-acc-label{font-size:11px;color:var(--muted);margin-bottom:4px}
  .tavly-num{font-size:26px;font-weight:700}
  .tavly-sub{font-size:11px;color:var(--muted);margin-top:4px}
  .prov-field{border-bottom:1px solid var(--border);padding-bottom:14px}
  .prov-head{display:flex;justify-content:space-between;align-items:center}
  .key-input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:8px 10px;border-radius:6px;font-size:13px}
  .key-actions{display:flex;align-items:center;gap:6px;margin-top:6px}
  .btn.mini{padding:5px 10px;font-size:12px}
  .ok-msg{font-size:11px;color:var(--green)}
  .switch{position:relative;width:36px;height:20px;display:inline-block;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:20px;transition:.3s}
  .slider:before{content:"";position:absolute;height:14px;width:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s}
  .switch input:checked + .slider{background:var(--green)}
  .switch input:checked + .slider:before{transform:translateX(16px)}
</style>
</head>
<body data-theme="dark" x-data="board()" x-init="init()" :data-theme="theme">

<div class="header">
  <h1>Token 余额看板</h1>
  <div class="toolbar">
    <button class="btn" @click="refresh()" :disabled="loading"><span x-text="loading ? '刷新中…' : '刷新'"></span></button>
    <button class="btn" @click="settingsOpen=true">设置</button>
  </div>
</div>

<div class="grid">
  <template x-for="p in providers" :key="p.key">
    <div class="card">
      <div class="card-head">
        <span class="card-name" x-text="p.name"></span>
        <span class="tier" x-show="p.data && p.data.level" x-text="'套餐 · ' + (p.data.level||'')"></span>
      </div>

      <!-- 余额型:DeepSeek -->
      <template x-if="p.key==='deepseek' && p.status==='ok'">
        <div>
          <div class="balance" x-text="'¥ ' + p.data.total_balance"></div>
          <div class="balance-sub">
            充值 ¥<span x-text="p.data.topped_up_balance"></span> · 赠金 ¥<span x-text="p.data.granted_balance"></span>
          </div>
          <div class="status">
            <span class="dot" :class="p.data.is_available ? 'ok' : 'err'"></span>
            <span x-text="(p.data.is_available ? '可调用' : '余额不足') + ' · ' + ago(p.updated_at)"></span>
          </div>
        </div>
      </template>

      <!-- 窗口型:智谱 -->
      <template x-if="p.key==='zhipu' && p.status==='ok'">
        <div>
          <template x-for="(w,i) in (p.data.windows||[])" :key="i">
            <div class="window">
              <div class="window-label">
                <span x-text="w.label + '窗口'"></span>
                <span x-text="w.used + ' / ' + w.total + ' 积分'"></span>
              </div>
              <div class="bar">
                <div class="bar-fill" :class="barClass(w)" :style="'width:' + pct(w) + '%'"></div>
              </div>
              <div class="reset" x-text="pct(w) + '% · ' + countdown(w.reset_at) + '后重置'"></div>
            </div>
          </template>
          <div class="status">
            <span class="dot ok"></span><span x-text="'已更新 · ' + ago(p.updated_at)"></span>
          </div>
        </div>
      </template>

      <!-- Tavly:多账号并排 -->
      <template x-if="p.key==='tavly' && p.status==='ok'">
        <div>
          <div class="tavly-accounts">
            <template x-for="(acc,i) in (p.data.accounts||[])" :key="i">
              <div class="tavly-acc">
                <div class="tavly-acc-label" x-show="acc.label" x-text="acc.label"></div>
                <div class="tavly-num" x-text="acc.remaining===null ? '无限' : acc.remaining"></div>
                <div class="tavly-sub" x-text="(acc.plan||'') + ' · 已用 ' + acc.used + (acc.total!==null ? '/'+acc.total : '')"></div>
                <div class="reset" x-text="acc.remaining===null ? '' : (acc.total ? pctRaw(acc.used,acc.total)+'% 剩余 · ' : '') + acc.reset_note"></div>
              </div>
            </template>
          </div>
          <template x-if="p.data.errors && p.data.errors.length">
            <div class="error-text" x-text="p.data.errors.join('; ')"></div>
          </template>
          <div class="status">
            <span class="dot ok"></span><span x-text="'已更新 · ' + ago(p.updated_at)"></span>
          </div>
        </div>
      </template>

      <!-- 错误 -->
      <template x-if="p.status==='error'">
        <div>
          <div class="placeholder">查询失败</div>
          <div class="error-text" x-text="p.error || ''"></div>
          <div class="status">
            <span class="dot err"></span><span x-text="ago(p.updated_at)"></span>
          </div>
        </div>
      </template>

      <!-- 未配置/占位 -->
      <template x-if="p.status==='unconfigured'">
        <div>
          <div class="placeholder">
            <span x-text="(p.data && p.data.note) ? p.data.note : '未配置 API Key'"></span><br>
            <span style="font-size:11px">点右上「设置」填入</span>
          </div>
        </div>
      </template>
    </div>
  </template>
</div>

<!-- 设置抽屉 -->
<div class="overlay" :class="settingsOpen?'show':''" @click="settingsOpen=false"></div>
<div class="drawer" :class="settingsOpen?'open':''">
  <h2 style="margin-bottom:20px;font-size:16px">设置</h2>
  <div class="field">
    <label>主题</label>
    <div class="seg">
      <template x-for="t in ['auto','light','dark']" :key="t">
        <button :class="theme===t?'active':''" @click="setTheme(t)" x-text="{auto:'跟随系统',light:'浅色',dark:'深色'}[t]"></button>
      </template>
    </div>
  </div>

  <template x-for="prov in settingsProviders" :key="prov.key">
    <div class="field prov-field">
      <div class="prov-head">
        <label x-text="prov.name"></label>
        <label class="switch">
          <input type="checkbox" :checked="!disabled.includes(prov.key)" @change="toggleDisable(prov.key, $event.target.checked)">
          <span class="slider"></span>
        </label>
      </div>
      <!-- 多key(tavly):两个输入框 -->
      <template x-if="prov.key==='tavly'">
        <div>
          <input class="key-input" type="password" placeholder="tvly-账号1..." x-model="keyInputs[prov.key]">
          <input class="key-input" type="password" placeholder="tvly-账号2(可空)..." x-model="keyInputs2[prov.key]" style="margin-top:6px">
          <div class="key-actions">
            <button class="btn mini" @click="saveKeyTavly(prov.key)">保存</button>
            <button class="btn mini" @click="revealKey(prov.key)">查看</button>
            <span class="ok-msg" x-show="savedMsg[prov.key]" x-text="savedMsg[prov.key]"></span>
          </div>
        </div>
      </template>
      <!-- 单key -->
      <template x-if="prov.key!=='tavly' && prov.needsKey">
        <div>
          <input class="key-input" type="password" :placeholder="prov.placeholder||''" x-model="keyInputs[prov.key]">
          <div class="key-actions">
            <button class="btn mini" @click="saveKey(prov.key)">保存</button>
            <button class="btn mini" @click="revealKey(prov.key)">查看</button>
            <span class="ok-msg" x-show="savedMsg[prov.key]" x-text="savedMsg[prov.key]"></span>
          </div>
        </div>
      </template>
      <template x-if="!prov.needsKey">
        <p class="hint" style="margin:0">走 Edge 登录态,无需填 Key。在 Edge 登录对应平台即可。</p>
      </template>
    </div>
  </template>

  <p class="hint">
    「查看」可回填已保存的 Key(明文),无需去平台重置。关闭开关后该供应商不再刷新、不展示。
  </p>
</div>

<script>
function board(){
  return {
    providers:[], loading:false, settingsOpen:false, theme:'dark', tick:0,
    disabled:[], keyInputs:{}, keyInputs2:{}, savedMsg:{},
    // 设置页展示的 provider 元数据(needsKey=false 的走 Edge cookie)
    settingsProviders:[
      {key:'deepseek',name:'DeepSeek',needsKey:true,placeholder:'sk-...'},
      {key:'zhipu',name:'智谱 Coding Plan',needsKey:true,placeholder:'xxx.yyy'},
      {key:'tavly',name:'Tavly',needsKey:true,placeholder:'tvly-...'},
      {key:'qianwen',name:'千问 Token Plan',needsKey:false},
      {key:'minimax',name:'MiniMax Token Plan',needsKey:false},
    ],
    async init(){
      await this.loadConfig();
      await this.refresh();
      setInterval(()=>this.refresh(),60000);  // 60秒轮询
      setInterval(()=>{this.tick++},1000);     // 倒计时每秒tick
    },
    async loadConfig(){
      const r=await fetch('/api/config');const d=await r.json();
      this.theme=d.theme;this.disabled=d.disabled||[];
    },
    async refresh(){
      this.loading=true;
      try{const r=await fetch('/api/refresh',{method:'POST'});const d=await r.json();this.providers=d.providers;}
      finally{this.loading=false;}
    },
    pct(w){this.tick;return w.total?Math.round((w.used/w.total)*100):0},
    pctRaw(used,total){return total?Math.round((used/total)*100):0},
    barClass(w){this.tick;const p=this.pct(w);return p>=90?'empty':p>=70?'warn':'ok'},
    countdown(iso){this.tick;if(!iso)return'未知';const ms=new Date(iso)-new Date();if(ms<=0)return'已重置';
      const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);
      return h>0?h+'小时'+m+'分':m+'分'},
    ago(iso){this.tick;if(!iso)return'';const s=Math.floor((Date.now()-new Date(iso))/1000);
      return s<60?'刚刚':Math.floor(s/60)+'分钟前'},
    flashSaved(p){this.savedMsg[p]='已保存';setTimeout(()=>{this.savedMsg[p]=''},1500)},
    async saveKey(p){
      const r=await fetch('/api/config/api-key',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({provider:p,key:this.keyInputs[p]})});
      const d=await r.json();if(d.ok){this.keyInputs[p]='';this.flashSaved(p);await this.refresh();}
    },
    async saveKeyTavly(p){
      // tavly 双 key:逗号拼接(空的那个省略)
      const k1=(this.keyInputs[p]||'').trim(),k2=(this.keyInputs2[p]||'').trim();
      const combined=k2?[k1,k2].join(','):k1;
      const r=await fetch('/api/config/api-key',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({provider:p,key:combined})});
      const d=await r.json();if(d.ok){this.keyInputs[p]='';this.keyInputs2[p]='';this.flashSaved(p);await this.refresh();}
    },
    async revealKey(p){
      const r=await fetch('/api/config/api-key?provider='+p);
      const d=await r.json();
      if(d.ok&&d.key){
        // tavly 拆成两个框;其他单框
        if(p==='tavly'){const parts=d.key.split(',');this.keyInputs[p]=parts[0]||'';this.keyInputs2[p]=parts[1]||'';}
        else{this.keyInputs[p]=d.key;}
        this.flashSaved(p);
      }
    },
    async toggleDisable(p,checked){
      // checked=true 表示启用,所以 disabled=!checked
      await fetch('/api/config/disabled',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({provider:p,disabled:!checked})});
      await this.loadConfig();
      await this.refresh();
    },
    async setTheme(t){this.theme=t;await fetch('/api/config/theme',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({theme:t})});},
  }
}
</script>
</body>
</html>
